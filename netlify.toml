[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Unearthed Education online application — apply.unearthededucation.org/<trip>.
# Everything under /api/* is a function; see `config.path` in each file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self' https://www.unearthededucation.org https://unearthededucation.org https://dashboard.pacificdiscovery.org; form-action 'self' https://checkout.stripe.com"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sign"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/sign"
  to = "/sign.html"
  status = 200

# Every launch link (/<trip-slug>) is the same page; app.js reads the slug.
[[redirects]]
  from = "/:slug"
  to = "/index.html"
  status = 200

# The portals' data source (/api/jotform) can page through every application.
[functions."jotform-api"]
  timeout = 26
